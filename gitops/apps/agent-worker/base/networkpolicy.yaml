# Firewall rules for the worker. Everything not allowed below is denied.
---
# 1. Deny all traffic in and out of the namespace by default (nothing calls the worker)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agent-worker
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. Outbound: DNS; the PII gateway; HTTPS inside the VPC (SQS and S3 interface
#    endpoints); the node's Pod Identity agent. No internet, and no Bedrock
#    endpoint access is granted by IAM either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: agent-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The gateway's container port (its Service maps 80 -> 8080)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pii-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pii-gateway
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - port: 443
          protocol: TCP
    # Pod Identity agent on the pod's own node: AWS credentials
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - port: 80
          protocol: TCP
