apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: agent-worker
  labels:
    app.kubernetes.io/name: agent-worker
spec:
  # No "replicas" here: KEDA owns the count (0 when the queue is empty)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
    spec:
      serviceAccountName: agent-worker
      automountServiceAccountToken: false
      # A job can take up to the queue's 300 s visibility timeout; on scale-down
      # or a node drain the worker finishes its current job before exiting
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-worker
          image: agent-worker # set per environment by the overlays
          ports:
            - name: metrics # Prometheus scrapes /metrics here (PodMonitor in the EKS overlay)
              containerPort: 9100
          # No probes: a queue consumer serves no traffic. If the process dies,
          # Kubernetes restarts it and the unfinished job reappears on the queue.
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m     # mostly waiting on the gateway
              memory: 256Mi # datasets held in memory: a few MB
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
