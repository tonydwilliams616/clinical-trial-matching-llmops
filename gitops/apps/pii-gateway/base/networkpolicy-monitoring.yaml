# Let Prometheus (monitoring namespace) read this service's metrics, and nothing
# else from that namespace. Added alongside the default-deny policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: pii-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pii-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
