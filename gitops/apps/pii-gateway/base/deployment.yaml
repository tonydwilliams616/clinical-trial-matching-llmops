apiVersion: apps/v1
kind: Deployment
metadata:
  name: pii-gateway
  namespace: pii-gateway
  labels:
    app.kubernetes.io/name: pii-gateway
spec:
  # No "replicas" here: the HPA owns the replica count (2-6)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pii-gateway
  strategy:
    rollingUpdate:
      maxUnavailable: 0 # never drop below the current count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pii-gateway
    spec:
      serviceAccountName: pii-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread copies across zones (hard rule) and nodes (best effort), so one
      # zone or node failing never takes out every copy
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pii-gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pii-gateway
      containers:
        - name: pii-gateway
          image: pii-gateway # set per environment by the overlays
          ports:
            - name: http
              containerPort: 8080
          env:
            # Writable cache location for libraries; the root filesystem is read-only
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi # the language model needs ~800 MB in memory
            limits:
              memory: 1536Mi
          # Model loading takes a few seconds: allow up to 60 s before the
          # liveness probe can restart the container
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
