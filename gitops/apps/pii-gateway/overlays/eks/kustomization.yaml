# EKS: the image that passed the benchmark gate, from ECR, pinned by commit SHA
# (tags are immutable). Pods run on Karpenter-managed workload nodes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - podmonitor.yaml
  - networkpolicy-tracing.yaml
images:
  - name: pii-gateway
    newName: 359013545044.dkr.ecr.us-east-1.amazonaws.com/ctm/pii-gateway
    newTag: 9faef5682af253e5a217c0acf589928bfc7d2f8e
patches:
  - target:
      kind: Deployment
      name: pii-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role: workload
      # The project's Bedrock inference profile (18-data output
      # bedrock_profile_arn). Not a secret: the gateway's IAM role is what
      # limits who can call it.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEDROCK_MODEL_ID
          value: arn:aws:bedrock:us-east-1:359013545044:application-inference-profile/6l3qzrqrfare
      # Send traces to Tempo (allowed by networkpolicy-tracing.yaml). Without
      # this variable the app creates spans but exports nothing.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring.svc:4318
