# EKS: the image that passed the benchmark gate, from ECR, pinned by commit SHA
# (tags are immutable). Pods run on Karpenter-managed workload nodes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - podmonitor.yaml
  - networkpolicy-tracing.yaml
images:
  - name: pii-gateway
    newName: 359013545044.dkr.ecr.us-east-1.amazonaws.com/ctm/pii-gateway
    newTag: d204ba86872e536b30ab7c36e1b31c04d243b0b2
patches:
  - target:
      kind: Deployment
      name: pii-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node-role: workload
      # The project's Bedrock inference profile (18-data output
      # bedrock_profile_arn). Not a secret: the gateway's IAM role is what
      # limits who can call it.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BEDROCK_MODEL_ID
          value: arn:aws:bedrock:us-east-1:359013545044:application-inference-profile/6l3qzrqrfare
      # Send traces to Tempo (allowed by networkpolicy-tracing.yaml). Without
      # this variable the app creates spans but exports nothing.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring.svc:4318
      # FastAPI's built-in telemetry also reads the endpoint above and would
      # add its own exporters: metrics and logs (Tempo answers 404) and a second
      # trace exporter on our provider. "none" turns each of those off; our own
      # exporter (app/tracing.py) is attached explicitly and still sends traces.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_TRACES_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_METRICS_EXPORTER
          value: none
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_LOGS_EXPORTER
          value: none
