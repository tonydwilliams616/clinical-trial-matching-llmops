# Tells Prometheus to read the gateway's /metrics every 15 seconds. EKS only:
# the kind test cluster has no Prometheus (and no PodMonitor CRD).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pii-gateway
  namespace: pii-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pii-gateway
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      # The gateway's own metrics carry an "endpoint" label (/v1/assess,
      # /v1/mask...). Prometheus also adds a target label called "endpoint"
      # (the port name, "http") and, by default, renames the app's label to
      # exported_endpoint - which left the dashboard and the SLO rules matching
      # nothing (found in the EKS proof session). honorLabels keeps the app's
      # label; the target's port name isn't needed.
      honorLabels: true
