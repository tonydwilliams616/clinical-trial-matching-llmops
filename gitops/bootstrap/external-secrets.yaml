# External Secrets Operator: copies secrets from AWS Secrets Manager into
# Kubernetes Secrets, so no secret value is ever stored in Git. Reads AWS with
# the Pod Identity role created in 30-platform (service account below).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets # must match the Pod Identity association
        nodeSelector:
          node-role: system
        webhook:
          nodeSelector:
            node-role: system
        certController:
          nodeSelector:
            node-role: system
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's CRDs exceed the 256 KB annotation limit of client-side apply
      - ServerSideApply=true
