# Lets ExternalSecret resources in any namespace read from AWS Secrets
# Manager. No credentials here: ESO uses its Pod Identity role, which only
# allows reading secrets named ctm/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
