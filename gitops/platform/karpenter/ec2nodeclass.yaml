# How Karpenter builds a node: OS image, IAM role, network placement, disk.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Latest EKS-optimised Amazon Linux 2023 image for the cluster's version
  amiSelectorTerms:
    - alias: al2023@latest
  # Fixed name created by 30-platform (also used by the destroy workflow)
  role: ctm-eks-karpenter-node
  # Private subnets and node security group, found by their discovery tags
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ctm-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ctm-eks
  # IMDSv2 only, and a hop limit of 1 so pods cannot reach the node's
  # instance metadata (and its credentials). Pods use Pod Identity instead.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Project: ctm
    ManagedBy: karpenter
