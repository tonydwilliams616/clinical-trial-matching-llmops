# What Karpenter may launch for workloads, and when it removes nodes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Spot first (cheapest), on-demand only if no Spot capacity
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # General-purpose, compute and memory families, 6th gen or newer
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge"]
      # Replace every node within a week, so nodes pick up patched images
      expireAfter: 168h
  # Cost cap: Karpenter will never run more than this in total
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    # Remove empty nodes and repack under-used ones onto cheaper capacity
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
