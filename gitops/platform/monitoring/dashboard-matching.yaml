# Grafana dashboard as code: the matching flow on one screen - gateway
# traffic and latency, Bedrock calls and tokens, safety-net refusals, queue
# depth, workers and shortlist results. Grafana's sidecar loads any ConfigMap
# labelled grafana_dashboard: "1"; edits made in the Grafana UI are not kept,
# so change this file instead. Panels show counts and timings only, never
# note text or identifiers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-matching-flow
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  matching-flow.json: |
    {
      "uid": "ctm-matching-flow",
      "title": "Clinical trial matching - flow",
      "tags": [
        "ctm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Right now",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Assess requests / min",
          "description": "Questions the workers are sending to the gateway.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(ctm_gateway_requests_total{endpoint=\"/v1/assess\"}[5m])) * 60",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Answered by the model",
          "description": "Share of assess requests that got a model answer (refusals and errors count against it).",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(ctm_gateway_requests_total{endpoint=\"/v1/assess\",status=\"200\"}[5m])) / sum(rate(ctm_gateway_requests_total{endpoint=\"/v1/assess\"}[5m]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Jobs waiting or in progress",
          "description": "SQS queue depth as KEDA sees it (visible + in-flight). KEDA scales workers on this.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(keda_scaler_metrics_value{scaledObject=\"agent-worker\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Workers running",
          "description": "0 when the queue is empty - that is the cost saving working.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"agent-worker\",deployment=\"agent-worker\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "row",
          "title": "Gateway",
          "id": 6,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Assess requests by status",
          "description": "200 answered, 422 refused by the safety check (nothing sent), 502 model unavailable.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(ctm_gateway_requests_total{endpoint=\"/v1/assess\"}[5m])) * 60",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqpm"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Assess latency",
          "description": "End to end inside the gateway: masking, safety check and the Bedrock call.",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(ctm_gateway_request_seconds_bucket{endpoint=\"/v1/assess\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ctm_gateway_request_seconds_bucket{endpoint=\"/v1/assess\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(ctm_gateway_request_seconds_bucket{endpoint=\"/v1/assess\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Bedrock latency and errors",
          "description": "The model call alone.",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ctm_gateway_bedrock_seconds_bucket[5m])))",
              "legendFormat": "p95 latency (s)"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(ctm_gateway_bedrock_errors_total[5m])) * 60",
              "legendFormat": "errors / min"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Bedrock tokens / min",
          "description": "Tokens drive Bedrock cost.",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (direction) (rate(ctm_gateway_tokens_total[5m])) * 60",
              "legendFormat": "{{direction}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Safety-net refusals / min",
          "description": "Notes refused because an identifier survived masking. Should be near zero; a rising line means masking broke (as with EMAIL on 21 Oct).",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (label) (rate(ctm_gateway_refusals_total[5m])) * 60",
              "legendFormat": "{{label}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "row",
          "title": "Matching results (selected time range)",
          "id": 12,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Model verdicts",
          "description": "",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (verdict) (increase(ctm_gateway_verdicts_total[$__range]))",
              "legendFormat": "{{verdict}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "bargauge",
          "title": "Candidates by status",
          "description": "Three-way shortlist. Worker series exist only while workers run.",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (increase(ctm_worker_candidates_total[$__range]))",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "bargauge",
          "title": "Jobs by outcome",
          "description": "",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (outcome) (increase(ctm_worker_jobs_total[$__range]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "row",
          "title": "Workers and queue",
          "id": 16,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Queue depth and workers",
          "description": "KEDA scale-from-zero and back, as it happens.",
          "id": 17,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(keda_scaler_metrics_value{scaledObject=\"agent-worker\"})",
              "legendFormat": "jobs waiting or in progress"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"agent-worker\",deployment=\"agent-worker\"})",
              "legendFormat": "workers running"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Job duration",
          "description": "Must stay well under the queue's 300 s visibility timeout.",
          "id": 18,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 31
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(ctm_worker_job_seconds_bucket[15m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ctm_worker_job_seconds_bucket[15m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
