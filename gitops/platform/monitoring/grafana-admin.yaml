# Grafana's admin login, copied from AWS Secrets Manager (ctm/grafana-admin)
# into a Kubernetes Secret. The value never appears in Git; ESO's role can
# read only secrets named ctm/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: ctm/grafana-admin # JSON with admin-user and admin-password
