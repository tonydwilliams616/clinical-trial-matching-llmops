# kubectl apply -k loadtest/gateway   (start)
# kubectl delete -k loadtest/gateway  (clean up, including the firewall opening)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - job.yaml
configMapGenerator:
  - name: k6-scripts
    namespace: loadtest
    files:
      - assess.js
