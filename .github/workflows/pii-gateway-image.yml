name: PII Gateway Image

# Every run: unit tests (inside the image build) -> build the runtime image ->
# benchmark it against the notes/v1 answer key -> fail below MIN_RECALL.
# main only, and only if all of that passed: push to ECR tagged with the SHA.
on:
  pull_request:
    paths:
      - "services/pii-gateway/**"
      - "scripts/eval/**"
      - ".github/workflows/pii-gateway-image.yml"
  push:
    branches: [main]
    paths:
      - "services/pii-gateway/**"
      - "scripts/eval/**"
      - ".github/workflows/pii-gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pii-gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REPOSITORY: ctm/pii-gateway
  CONTEXT: services/pii-gateway
  # Only pushes to main may publish (matches the push role's IAM trust policy)
  PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
  # Release gate: share of planted identifiers that must be FULLY masked.
  # Raise it as the gateway improves; never lower it without a written reason.
  MIN_RECALL: "0.89"
  BENCHMARK_S3: s3://ctm-raw-359013545044/notes/v1

jobs:
  build:
    name: test, benchmark and build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The test stage runs pytest during the build - a failing test fails the job
      - name: Run unit tests (test stage)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          target: test
          push: false
          cache-from: type=gha,scope=pii-gateway
          cache-to: type=gha,mode=max,scope=pii-gateway

      # Build the exact runtime image that would be pushed, and load it locally
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.CONTEXT }}
          target: runtime
          load: true
          tags: pii-gateway:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=pii-gateway
          provenance: false

      - name: Start gateway
        run: docker run -d --name pii-gateway -p 8080:8080 pii-gateway:ci

      - name: Configure AWS credentials (benchmark read-only role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          role-session-name: gha-eval-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download benchmark (notes/v1)
        run: |
          mkdir -p "$RUNNER_TEMP/notes-v1"
          for f in notes.jsonl labels.jsonl manifest.json; do
            aws s3 cp --only-show-errors "$BENCHMARK_S3/$f" "$RUNNER_TEMP/notes-v1/$f"
          done

      - name: Benchmark (release gate)
        run: >
          python3 scripts/eval/score_gateway.py
          --data-dir "$RUNNER_TEMP/notes-v1"
          --url http://localhost:8080
          --min-recall "$MIN_RECALL"
          --report benchmark-report.json

      # Counts only - no note text or identifier values
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: benchmark-report.json
          if-no-files-found: ignore

      - name: Gateway logs (on failure)
        if: failure()
        run: docker logs pii-gateway 2>&1 | tail -50

      - name: Configure AWS credentials (push role, main only)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR (main only)
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # Push the very image that was benchmarked - not a rebuild
      - name: Push runtime image (main only)
        if: env.PUSH == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag pii-gateway:ci "$IMAGE"
          docker push "$IMAGE"

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed pii-gateway image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
