name: PII Gateway Image

# Pull requests: run the tests inside the image build, then build the runtime
# image (no AWS access needed).
# main: same, then push the runtime image to ECR tagged with the commit SHA.
on:
  pull_request:
    paths:
      - "services/pii-gateway/**"
      - ".github/workflows/pii-gateway-image.yml"
  push:
    branches: [main]
    paths:
      - "services/pii-gateway/**"
      - ".github/workflows/pii-gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pii-gateway-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  REPOSITORY: ctm/pii-gateway
  CONTEXT: services/pii-gateway
  # Only pushes to main may publish (matches the push role's IAM trust policy)
  PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    name: test and build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The test stage runs pytest during the build - a failing test fails the job
      - name: Run tests (test stage)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          target: test
          push: false
          cache-from: type=gha,scope=pii-gateway
          cache-to: type=gha,mode=max,scope=pii-gateway

      - name: Configure AWS credentials (main only)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR (main only)
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build runtime image${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          target: runtime
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.REPOSITORY }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=pii-gateway
          # Single plain image manifest (no attestation index) - simplest for ECR
          provenance: false

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "### Pushed pii-gateway image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr.outputs.registry }}/${REPOSITORY}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
